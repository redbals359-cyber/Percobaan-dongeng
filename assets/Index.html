<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan Dongeng Interaktif</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .story-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .asset-preview {
            font-size: 14px;
            color: #666;
            background: #eef2f7;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h2 {
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
            min-height: 80px;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="story-container">
        <h3 id="story-title">Petualangan Menemukan Harta Karun Istana</h3>
        <div class="asset-preview" id="asset-info">Aset: -</div>
        <p id="story-text">Memuat cerita...</p>
        
        <div class="btn-container">
            <button id="prev-btn" onclick="prevPage()" disabled>Sebelumnya</button>
            <span id="page-indicator">1 / 10</span>
            <button id="next-btn" onclick="nextPage()">Selanjutnya</button>
        </div>
    </div>

    <script>
        // Data cerita berdasarkan aset yang ada di GitHub kamu
        const storyPages = [
            {
                page: 1,
                asset: "bg_rumah.png, karakter_utama.png, karakter_ibu.png",
                text: "Karakter utama bersiap-siap di depan rumah dan berpamitan kepada ibu untuk memulai petualangan hari itu."
            },
            {
                page: 2,
                asset: "karakter_utama.png, pohon.png, bunga.png",
                text: "Karakter utama berjalan melewati deretan pohon yang rindang dan memetik beberapa bunga yang indah di sepanjang jalan."
            },
            {
                page: 3,
                asset: "karakter_utama.png, karakter_teman.png, keranjang.png",
                text: "Di tengah perjalanan, ia bertemu dengan teman setianya yang membawa keranjang kosong untuk persiapan memungut hasil alam."
            },
            {
                page: 4,
                asset: "bg_sungai.png, karakter_utama.png, karakter_teman.png",
                text: "Kedua sahabat tiba di pinggir sungai yang airnya mengalir jernih, mencari cara yang aman untuk menyeberang."
            },
            {
                page: 5,
                asset: "batu.png, karakter_utama.png, karakter_teman.png",
                text: "Mereka harus berhati-hati memanjat dan melangkah di atas susunan batu licin agar bisa sampai ke seberang sungai."
            },
            {
                page: 6,
                asset: "bg_kastil.png, karakter_utama.png",
                text: "Dari kejauhan, kemegahan kastil tua mulai terlihat di balik kabut tipis, menandakan tujuan mereka sudah dekat."
            },
            {
                page: 7,
                asset: "bg_kastil.png, karakter_utama.png, karakter_teman.png",
                text: "Karakter utama dan temannya berhasil mencapai gerbang utama istana tua yang menyimpan banyak misteri."
            },
            {
                page: 8,
                asset: "bg_kastil.png, keranjang.png",
                text: "Di dalam ruangan tersembunyi kastil, mereka menyiapkan keranjang untuk bersiap membawa sesuatu yang penting."
            },
            {
                page: 9,
                asset: "harta.png, keranjang.png, karakter_utama.png",
                text: "Betapa terkejutnya mereka saat menemukan tumpukan harta berkilau yang kemudian dimasukkan dengan hati-hati ke dalam keranjang."
            },
            {
                page: 10,
                asset: "karakter_ibu.png, karakter_utama.png, karakter_teman.png, harta.png",
                text: "Petualangan selesai! Mereka kembali berkumpul dengan ibu untuk merayakan keberhasilan dan membagikan hasil petualangan."
            }
        ];

        let currentPage = 0;

        function updateStory() {
            const currentData = storyPages[currentPage];
            document.getElementById("story-text").innerText = currentData.text;
            document.getElementById("asset-info").innerText = "Aset Terkait: " + currentData.asset;
            document.getElementById("page-indicator").innerText = (currentPage + 1) + " / " + storyPages.length;

            // Kontrol tombol aktif/nonaktif
            document.getElementById("prev-btn").disabled = currentPage === 0;
            document.getElementById("next-btn").disabled = currentPage === storyPages.length - 1;
        }

        function nextPage() {
            if (currentPage < storyPages.length - 1) {
                currentPage++;
                updateStory();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateStory();
            }
        }

        // Inisialisasi awal saat halaman dimuat
        updateStory();
    </script>

</body>
</html>
