<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percobaan Dongeng Interaktif</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .story-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .image-box {
            width: 100%;
            height: 250px;
            background-color: #eef2f7;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .asset-preview {
            font-size: 13px;
            color: #666;
            background: #eef2f7;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: inline-block;
        }
        h3 {
            margin-top: 0;
            color: #333;
        }
        p {
            font-size: 16px;
            color: #555;
            min-height: 60px;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="story-container">
        <h3>Petualangan Menemukan Harta Karun Istana</h3>
        
        <!-- Area untuk menampilkan gambar aset -->
        <div class="image-box">
            <img id="story-image" src="" alt="Aset Cerita">
        </div>

        <div class="asset-preview" id="asset-info">Aset: -</div>
        <p id="story-text">Memuat cerita...</p>
        
        <div class="btn-container">
            <button id="prev-btn" onclick="prevPage()" disabled>Sebelumnya</button>
            <span id="page-indicator">1 / 10</span>
            <button id="next-btn" onclick="nextPage()">Selanjutnya</button>
        </div>
    </div>
